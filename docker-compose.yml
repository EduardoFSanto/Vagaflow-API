services:
  postgres:
    image: postgres:16
    container_name: vagaflow-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vagaflow}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
